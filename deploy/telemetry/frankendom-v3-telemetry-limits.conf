# /etc/nginx/conf.d/frankendom-v3-telemetry-limits.conf   (NOT installed by this repo: deploy/telemetry/README.md)
# http{} level: the per-address budget the /t location in frankendom-v3-telemetry.conf names. 2 events batches a second per address is far above what one browser sends (a batch every 15 s). 1 MB of zone holds about 16k addresses.
limit_req_zone $binary_remote_addr zone=v3_telemetry_req:2m rate=2r/s;
