# /etc/nginx/snippets/frankendom-v3-telemetry.conf   (NOT installed by this repo: deploy/telemetry/README.md is the ordered runbook)
# Included ONLY inside the :443 server block of /etc/nginx/sites-available/v3.frankendom.com, next to the presence include. The page posts to the same-origin path /t, so there is no CORS, no CSP change and no new host.
# The exact line to add, once, inside that :443 block (a good spot is just above the presence include):
#     include /etc/nginx/snippets/frankendom-v3-telemetry.conf;
# ONE exact path (the collector's /t/health is deliberately not proxied; read it on the box: curl http://127.0.0.1:8796/t/health).
# Privacy: access_log is off for this route (nginx's access log is where an address would be written) and no address header is passed on, so the collector never sees one.
# Needs the zone in frankendom-v3-telemetry-limits.conf (http{} level, /etc/nginx/conf.d/, which nginx.conf includes).
location = /t {
    limit_except POST { deny all; }
    limit_req zone=v3_telemetry_req burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    access_log off;

    proxy_pass http://127.0.0.1:8796;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    add_header Cache-Control "no-store" always;
}
