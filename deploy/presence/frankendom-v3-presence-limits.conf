# /etc/nginx/conf.d/frankendom-v3-presence-limits.conf   (NOT installed by this repo: deploy/presence/README.md)
# http{} level (nginx.conf includes /etc/nginx/conf.d/*.conf, as it does for frankendom-origins-limits.conf and arma-limits.conf): the per-IP budgets the /presence location in
# frankendom-v3-presence.conf names. 1 MB of zone holds about 16k addresses; 2 MB each is far more than a yard-sized zone needs.
limit_conn_zone $binary_remote_addr zone=v3_presence_conn:2m;
limit_req_zone  $binary_remote_addr zone=v3_presence_req:2m rate=1r/s;
