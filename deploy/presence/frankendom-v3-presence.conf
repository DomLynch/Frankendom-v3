# /etc/nginx/snippets/frankendom-v3-presence.conf   (NOT installed by this repo: deploy/presence/README.md is the ordered runbook)
# Included ONLY inside the :443 server block of /etc/nginx/sites-available/v3.frankendom.com (sites-enabled/ holds a symlink to it; the way the frankendom.com block includes V1's frankendom-presence.conf), so presence is
# reachable over TLS only: wss://v3.frankendom.com/presence (the page's ?presence=1). The :80 block redirects everything to https and is not touched.
# The exact line to add, once, inside that :443 block (read from the live file 2026-10-27; a good spot is just above `location ^~ /b/ {`):
#     include /etc/nginx/snippets/frankendom-v3-presence.conf;
# ONE exact path, nothing else: /presence/health (which can hand out tick samples) is deliberately NOT proxied; it is read on the box with curl http://127.0.0.1:8794/presence/health.
# X-Real-IP is set here, overwriting anything a client sent: the service's per-IP caps read it (server/presence/main.ts trusts it only while bound to loopback).
# Needs the two zones in frankendom-v3-presence-limits.conf (http{} level: /etc/nginx/conf.d/, which nginx.conf includes). Zone names carry v3_ so they never clash with arma_* or frankendom_origins.
location = /presence {
    # Per IP: 8 live sockets (the service itself allows 16 and 30 joins a minute) and one new WebSocket a second with a burst of 5.
    limit_conn v3_presence_conn 8;
    limit_req zone=v3_presence_req burst=5 nodelay;
    limit_conn_status 429;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8794;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The service beats every 2 s and drops an idle socket at 30 s: 90 s is a safe ceiling for a silent proxy hop.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    tcp_nodelay on;
}
