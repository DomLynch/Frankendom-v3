name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the stub boundary: nothing outside src/stubs.ts imports core/* (but registry.ts), net, zones, legends or pit
      - run: npm run check:stubs
      # the as-data gate: a number, timer, cap, label or content id that belongs in a data row, written in the live-zone code (scripts/as-data/scope.json)
      - run: npm run check:as-data
      # Gate 0 (test/gate0) replays input scripts through V1's sim at the seed tag; the default checkout is shallow and tagless
      - name: Fetch the V1 seed tag for Gate 0
        run: git fetch --no-tags --depth=1 origin refs/tags/v1-seed-82a994d15:refs/tags/v1-seed-82a994d15
      - run: npm test
      - name: Gate 0 table
        run: npm run --silent gate0:table >> "$GITHUB_STEP_SUMMARY"
      # V3-only rows (test/gate0/v3-scripts): no V1 reference; this tree twice + the pinned hashes in test/gate0/v3-golden.json
      - name: Gate 0 V3-only table
        run: npm run --silent gate0:v3 >> "$GITHUB_STEP_SUMMARY"
      # the build packs the Centurion's GLBs as V1 does (scripts/optimize-glb.mjs), which recodes their JPEGs losslessly with jpegtran
      - name: jpegtran
        run: command -v jpegtran || (sudo apt-get update -qq && sudo apt-get install -y -qq libjpeg-turbo-progs)
      - run: npm run build
      # 106 only: the built dist/ holds no 65 body, kit or 65-keyed clip JSON, and no bundle names one (data/build.json notShipped)
      - name: No 65 file in dist/
        run: DIST_REQUIRED=1 node --test test/rig-bones.test.mjs

  # The PRODUCTION build booted in headless Chromium (scripts/boot-check.mjs): hero and first boss spawned, the hero's sword loaded, the loop alive,
  # zero console errors, zero failed or 404 requests. Two live breaks (the Gargantua freeze, the hero sword missing on live) shipped because nothing booted the BUILT game.
  # Runs beside `test`, not after it. The 375 screenshot is uploaded on every run.
  boot:
    name: built-game boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: jpegtran
        run: command -v jpegtran || (sudo apt-get update -qq && sudo apt-get install -y -qq libjpeg-turbo-progs)
      - run: npm run build
      # the boss data test (test/boss-expect.test.mjs) again, now against the PRODUCTION build: every boss part, off-hand and body is in dist under its hashed name
      - run: BOSS_EXPECT_DIST=1 node --test --test-name-pattern 'production build' test/boss-expect.test.mjs
      # --no-save keeps playwright out of package.json and the lockfile (the stills scripts take it from the machine they run on)
      - run: npm install --no-save --no-audit --no-fund playwright@1.63.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-${{ runner.os }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/boot-check.mjs
        timeout-minutes: 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-check-375
          path: boot-check-out/
          if-no-files-found: ignore

  # The zone server SQL (supabase/migrations/20261027000001_zone_server.sql) EXECUTED against a real Postgres and compared with the JS model (test/sql/zone-sql.test.mjs).
  # A separate job: the `test` job stays fast and does not wait for it, and `deploy` does not need it. The database is a throwaway service container, the password below is a
  # throwaway value for that container only (not a secret), and nothing here touches Supabase or any real database. The Supabase-specific roles are plain NOLOGIN roles (test/sql/bootstrap.sql).
  zone-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: zone-sql-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: zone-sql-throwaway
      PGDATABASE: postgres
      ZONE_SQL_URL: postgres://postgres:zone-sql-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: psql client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Server version
        run: psql -Atc "select version()"
      - name: Bootstrap (plain roles standing in for Supabase's, the test clock)
        run: psql -v ON_ERROR_STOP=1 -q -f test/sql/bootstrap.sql
      - name: Apply the migration
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261027000001_zone_server.sql
      - name: DOWN migration, then apply again (round trip)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/down/20261027000001_zone_server_down.sql
          psql -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and proname like 'zone\_%'" | grep -qx 0
          psql -tAc "select count(*) from pg_class where relname like 'zone\_%' and relkind = 'r'" | grep -qx 0
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261027000001_zone_server.sql
      - name: Run the SQL against the JS model
        timeout-minutes: 4
        run: node --test --test-force-exit --test-timeout=60000 --test-reporter=spec test/sql/zone-sql.test.mjs

  # Every green main goes live at https://v3.frankendom.com (site root, no prefix), once the deploy secrets exist.
  # The key is locked by rrsync to the site folder on the VPS, so the remote path is "./".
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      KEY: ${{ secrets.V3_DEPLOY_KEY }}
      KH: ${{ secrets.V3_DEPLOY_KNOWN_HOSTS }}
      U: ${{ secrets.V3_DEPLOY_USER }}
      H: ${{ secrets.V3_DEPLOY_HOST }}
    steps:
      - name: Deploy configured?
        id: cfg
        run: |
          if [ -n "$KEY" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "no V3_DEPLOY_KEY yet, build only"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.on
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.on
        with:
          node-version: 22
          cache: npm
      # code lives under b/<sha>/ so a phone never runs a cached older module after a deploy; binary assets and
      # data stay at stable root paths (scripts/build.mjs)
      - name: Assemble site
        if: steps.cfg.outputs.on
        run: (command -v jpegtran || (sudo apt-get update -qq && sudo apt-get install -y -qq libjpeg-turbo-progs)) && npm ci &&BUILD="${GITHUB_SHA}" npm run build && grep -q "b/${GITHUB_SHA}/src/client/main.js" dist/index.html
      - name: Publish
        if: steps.cfg.outputs.on
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          printf '%s\n' "$KH" > kh
          rsync -az --delete -e "ssh -i key -o IdentitiesOnly=yes -o UserKnownHostsFile=kh -o StrictHostKeyChecking=yes" dist/ "$U@$H":./
          rm -f key kh
      # The server falls back to index.html for unknown paths, so only an exact SHA match counts.
      # --resolve pins the VPS address, so a stale public DNS cache can't fail the check.
      - name: Check served build
        if: steps.cfg.outputs.on
        run: |
          ip=$(getent ahostsv4 "$H" | awk 'NR==1{print $1}'); ip=${ip:-$H}
          for i in $(seq 1 20); do
            served=$(curl -fsS --resolve "v3.frankendom.com:443:$ip" https://v3.frankendom.com/build.txt || true)
            if [ "$served" = "$GITHUB_SHA" ]; then echo "live: $served"; exit 0; fi
            echo "try $i: got '${served:0:40}'"; sleep 15
          done
          exit 1
